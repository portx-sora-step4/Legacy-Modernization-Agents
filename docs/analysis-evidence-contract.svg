<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     font-family='-apple-system, "Helvetica Neue", "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif'>
  <title>解析証跡を失わない二つの品質経路</title>
  <desc>parser経路と分析出力経路で、入力根拠、縮退状態、失敗状態を結果へ伝える構成</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#87867F"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F0EEE6"/>
  <text x="800" y="82" text-anchor="middle" font-size="46" font-weight="700" fill="#000000">
    解析証跡を失わない二つの品質経路
  </text>
  <text x="800" y="120" text-anchor="middle" font-size="19" fill="#83827B">
    固定形式parserとAI分析出力を、同じ「根拠と失敗を結果へ伝える」契約で扱う
  </text>

  <rect x="60" y="155" width="1480" height="300" rx="24" fill="#FAF9F5"/>
  <text x="100" y="205" font-size="29" font-weight="700" fill="#3D3D3A">parser経路</text>
  <text x="100" y="235" font-size="18" fill="#83827B">文字と列位置を保ち、縮退と失敗を終了状態へ反映</text>

  <rect x="150" y="285" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#87867F" stroke-width="2"/>
  <text x="275" y="326" text-anchor="middle" font-size="23" font-weight="650" fill="#3D3D3A">COBOL入力</text>
  <text x="275" y="357" text-anchor="middle" font-size="18" fill="#83827B">UTF-8 / legacy encoding</text>

  <rect x="500" y="265" width="280" height="140" rx="10" fill="#E9F7F2" stroke="#87867F" stroke-width="2"/>
  <text x="640" y="306" text-anchor="middle" font-size="23" font-weight="650" fill="#3D3D3A">前処理</text>
  <text x="640" y="338" text-anchor="middle" font-size="18" fill="#83827B">display columns</text>
  <text x="640" y="365" text-anchor="middle" font-size="18" fill="#83827B">sequence area / 改行</text>

  <rect x="880" y="265" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#87867F" stroke-width="2"/>
  <text x="1010" y="306" text-anchor="middle" font-size="23" font-weight="650" fill="#3D3D3A">出力先Gate</text>
  <text x="1010" y="340" text-anchor="middle" font-size="18" fill="#83827B">host directory</text>
  <text x="1010" y="367" text-anchor="middle" font-size="18" fill="#83827B">存在・書込可能</text>

  <rect x="1240" y="255" width="250" height="160" rx="10" fill="#DDE2D6"/>
  <text x="1365" y="298" text-anchor="middle" font-size="23" font-weight="700" fill="#3D3D3A">parser結果</text>
  <rect x="1272" y="320" width="84" height="34" rx="17" fill="#AEE6D3"/>
  <text x="1314" y="343" text-anchor="middle" font-size="16" fill="#3D3D3A">full</text>
  <rect x="1366" y="320" width="94" height="34" rx="17" fill="#F8E8C8"/>
  <text x="1413" y="343" text-anchor="middle" font-size="16" fill="#3D3D3A">deps-only</text>
  <rect x="1314" y="366" width="102" height="34" rx="17" fill="#F5CBBC"/>
  <text x="1365" y="389" text-anchor="middle" font-size="16" fill="#3D3D3A">failure</text>

  <line x1="400" y1="335" x2="500" y2="335" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="320" text-anchor="middle" font-size="17" fill="#83827B">bytes</text>
  <line x1="780" y1="335" x2="880" y2="335" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="320" text-anchor="middle" font-size="17" fill="#83827B">normalized</text>
  <line x1="1140" y1="335" x2="1240" y2="335" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1190" y="320" text-anchor="middle" font-size="17" fill="#83827B">exit code</text>

  <rect x="60" y="485" width="1480" height="350" rx="24" fill="#FAF9F5"/>
  <text x="100" y="535" font-size="29" font-weight="700" fill="#3D3D3A">分析出力経路</text>
  <text x="100" y="565" font-size="18" fill="#83827B">AI要約と分離した決定論的な根拠を、生成物へ残す</text>

  <rect x="150" y="625" width="240" height="100" rx="10" fill="#FFFFFF" stroke="#87867F" stroke-width="2"/>
  <text x="270" y="666" text-anchor="middle" font-size="23" font-weight="650" fill="#3D3D3A">COBOL + copybook</text>
  <text x="270" y="698" text-anchor="middle" font-size="18" fill="#83827B">source lines</text>

  <rect x="500" y="565" width="280" height="100" rx="10" fill="#E9F7F2" stroke="#87867F" stroke-width="2"/>
  <text x="640" y="606" text-anchor="middle" font-size="22" font-weight="650" fill="#3D3D3A">依存関係抽出</text>
  <text x="640" y="638" text-anchor="middle" font-size="18" fill="#83827B">COPY / CICS + lineNumber</text>

  <rect x="500" y="695" width="280" height="100" rx="10" fill="#E9F7F2" stroke="#87867F" stroke-width="2"/>
  <text x="640" y="736" text-anchor="middle" font-size="22" font-weight="650" fill="#3D3D3A">業務ルール抽出</text>
  <text x="640" y="768" text-anchor="middle" font-size="18" fill="#83827B">AI response + ID正規化</text>

  <rect x="900" y="565" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#87867F" stroke-width="2"/>
  <text x="1025" y="606" text-anchor="middle" font-size="22" font-weight="650" fill="#3D3D3A">dependency map</text>
  <text x="1025" y="638" text-anchor="middle" font-size="18" fill="#83827B">対象・順序・source line</text>

  <rect x="900" y="695" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#87867F" stroke-width="2"/>
  <text x="1025" y="736" text-anchor="middle" font-size="22" font-weight="650" fill="#3D3D3A">business rules</text>
  <text x="1025" y="768" text-anchor="middle" font-size="18" fill="#83827B">一意で連続したBR-ID</text>

  <rect x="1260" y="620" width="230" height="120" rx="10" fill="#DDE2D6"/>
  <text x="1375" y="665" text-anchor="middle" font-size="23" font-weight="700" fill="#3D3D3A">根拠付き出力</text>
  <text x="1375" y="700" text-anchor="middle" font-size="18" fill="#83827B">一致 / 不足 / 仮説</text>

  <path d="M390 675 H445 V615 H500" fill="none" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M390 675 H445 V745 H500" fill="none" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="615" x2="900" y2="615" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="745" x2="900" y2="745" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1150 615 H1205 V680 H1260" fill="none" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1150 745 H1205 V680" fill="none" stroke="#87867F" stroke-width="2"/>

  <text x="1480" y="875" text-anchor="end" font-size="16" fill="#83827B">実線 = 主経路</text>
</svg>
