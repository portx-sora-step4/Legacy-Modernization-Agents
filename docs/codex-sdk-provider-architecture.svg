<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     font-family='-apple-system, "Helvetica Neue", "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif'
     role="img" aria-labelledby="title description">
  <title id="title">Azure Agents と Codex SDK の接続構成</title>
  <desc id="description">GCE上の.NET AgentがPython sidecarを介してCodex SDKを呼び、ChatGPTのdevice code認証を再利用する構成。APIキーはsidecarへ渡さない。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#87867F"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1.5 1.5 L 8.5 5 L 1.5 8.5" fill="none" stroke="#188F6B"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F0EEE6"/>
  <text x="70" y="78" font-size="46" font-weight="700" fill="#000000">Azure Agents と Codex SDK の接続構成</text>
  <text x="72" y="118" font-size="20" fill="#83827B">ChatGPT 認証を再利用し、APIキーをアプリ設定へ追加しない</text>

  <rect x="60" y="160" width="1120" height="670" rx="24" fill="#FAF9F5"/>
  <text x="92" y="205" font-size="28" font-weight="700" fill="#3D3D3A">GCE 実行領域</text>
  <text x="92" y="235" font-size="18" fill="#83827B">portx-formula-codex-spot / 専用作業ディレクトリ</text>

  <rect x="110" y="305" width="220" height="240" rx="10" fill="#FFFFFF" stroke="#87867F" stroke-width="2"/>
  <text x="220" y="355" text-anchor="middle" font-size="25" font-weight="700" fill="#3D3D3A">Azure Agents</text>
  <text x="220" y="393" text-anchor="middle" font-size="18" fill="#83827B">.NET 10</text>
  <rect x="142" y="430" width="156" height="42" rx="8" fill="#E5E5ED"/>
  <text x="220" y="457" text-anchor="middle" font-size="17" fill="#3D3D3A">IChatClient</text>
  <text x="220" y="505" text-anchor="middle" font-size="16" fill="#83827B">prompt / response</text>

  <rect x="390" y="285" width="250" height="280" rx="10" fill="#E9F7F2" stroke="#87867F" stroke-width="2"/>
  <text x="515" y="337" text-anchor="middle" font-size="24" font-weight="700" fill="#3D3D3A">CodexSdkChatClient</text>
  <text x="515" y="377" text-anchor="middle" font-size="17" fill="#83827B">provider adapter</text>
  <rect x="426" y="416" width="178" height="40" rx="8" fill="#AEE6D3"/>
  <text x="515" y="442" text-anchor="middle" font-size="16" fill="#3D3D3A">timeout + process kill</text>
  <rect x="426" y="470" width="178" height="40" rx="8" fill="#FFFFFF"/>
  <text x="515" y="496" text-anchor="middle" font-size="16" fill="#3D3D3A">bounded output</text>
  <text x="515" y="538" text-anchor="middle" font-size="15" fill="#83827B">失敗は例外として返却</text>

  <rect x="700" y="305" width="220" height="240" rx="10" fill="#BAD7F5" stroke="#87867F" stroke-width="2"/>
  <text x="810" y="355" text-anchor="middle" font-size="24" font-weight="700" fill="#3D3D3A">Python sidecar</text>
  <text x="810" y="393" text-anchor="middle" font-size="17" fill="#3D3D3A">UTF-8 JSON</text>
  <rect x="734" y="430" width="152" height="42" rx="8" fill="#FFFFFF"/>
  <text x="810" y="457" text-anchor="middle" font-size="16" fill="#3D3D3A">stdin / stdout</text>
  <text x="810" y="503" text-anchor="middle" font-size="15" fill="#3D3D3A">unknown field 拒否</text>
  <text x="810" y="528" text-anchor="middle" font-size="15" fill="#3D3D3A">credential 形式を伏字化</text>

  <rect x="980" y="305" width="150" height="240" rx="10" fill="#DDE2D6" stroke="#87867F" stroke-width="2"/>
  <text x="1055" y="355" text-anchor="middle" font-size="24" font-weight="700" fill="#3D3D3A">Codex SDK</text>
  <text x="1055" y="395" text-anchor="middle" font-size="16" fill="#3D3D3A">ephemeral thread</text>
  <text x="1055" y="425" text-anchor="middle" font-size="16" fill="#3D3D3A">deny_all</text>
  <text x="1055" y="455" text-anchor="middle" font-size="16" fill="#3D3D3A">read-only</text>
  <rect x="1003" y="488" width="104" height="38" rx="8" fill="#FFFFFF"/>
  <text x="1055" y="513" text-anchor="middle" font-size="15" fill="#3D3D3A">gpt-5.6-terra</text>

  <line x1="330" y1="425" x2="390" y2="425" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="406" text-anchor="middle" font-size="16" fill="#83827B">chat</text>
  <line x1="640" y1="425" x2="700" y2="425" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="405" text-anchor="middle" font-size="16" fill="#83827B">JSON</text>
  <line x1="920" y1="425" x2="980" y2="425" stroke="#87867F" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="405" text-anchor="middle" font-size="16" fill="#83827B">SDK</text>

  <rect x="1205" y="285" width="330" height="300" rx="24" fill="#E5E5ED"/>
  <text x="1370" y="340" text-anchor="middle" font-size="28" font-weight="700" fill="#3D3D3A">ChatGPT account</text>
  <text x="1370" y="380" text-anchor="middle" font-size="18" fill="#83827B">device code 認証</text>
  <rect x="1260" y="425" width="220" height="52" rx="26" fill="#FFFFFF" stroke="#87867F" stroke-width="2"/>
  <text x="1370" y="458" text-anchor="middle" font-size="18" fill="#3D3D3A">Codex device auth</text>
  <rect x="1284" y="508" width="172" height="42" rx="8" fill="#AEE6D3"/>
  <text x="1370" y="535" text-anchor="middle" font-size="17" fill="#3D3D3A">API key 不使用</text>

  <line x1="1130" y1="425" x2="1205" y2="425" stroke="#188F6B" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1168" y="401" text-anchor="middle" font-size="16" fill="#188F6B">model turn</text>
  <path d="M 1205 505 C 1170 505, 1170 535, 1130 535" fill="none" stroke="#87867F" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="1172" y="560" text-anchor="middle" font-size="15" fill="#83827B">login session</text>

  <rect x="110" y="625" width="1020" height="145" rx="16" fill="#FFFFFF"/>
  <text x="140" y="666" font-size="21" font-weight="700" fill="#3D3D3A">実行時の安全境界</text>
  <rect x="140" y="695" width="205" height="44" rx="22" fill="#E9F7F2"/>
  <text x="243" y="723" text-anchor="middle" font-size="16" fill="#3D3D3A">API key field なし</text>
  <rect x="365" y="695" width="205" height="44" rx="22" fill="#E9F7F2"/>
  <text x="468" y="723" text-anchor="middle" font-size="16" fill="#3D3D3A">shell 文字列連結なし</text>
  <rect x="590" y="695" width="230" height="44" rx="22" fill="#E9F7F2"/>
  <text x="705" y="723" text-anchor="middle" font-size="16" fill="#3D3D3A">5分 timeout / 強制終了</text>
  <rect x="840" y="695" width="250" height="44" rx="22" fill="#F5CBBC"/>
  <text x="965" y="723" text-anchor="middle" font-size="16" fill="#3D3D3A">ローカル読取防止は未実証</text>

  <text x="70" y="868" font-size="16" fill="#83827B">主経路: prompt → UTF-8 JSON → ephemeral Codex thread → response</text>
</svg>
